<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片视频下载</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <main class="panel">
    <h1>图片视频下载</h1>
    <p id="summary">读取状态中…</p>
    <ul id="errors"></ul>
    <button id="copy-images" type="button" disabled>复制全部原图</button>
    <button id="copy-videos" type="button" disabled>复制全部视频</button>
    <p id="copy-status" role="status" aria-live="polite"></p>
    <p class="hint">复制最近下载的帖子文件，随后到 QQ／微信群聊按 Ctrl+V。首次使用需安装本机小助手。</p>
    <button id="open-options" type="button">下载目录说明</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
