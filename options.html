<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载目录说明</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <h1>下载目录说明</h1>
    <p>文件保存在 Chrome 下载目录下，按平台、媒体类型、博主名称和帖子分类：</p>
    <ul>
      <li>微博 / 图片或视频 / 博主名称 / 帖子ID</li>
      <li>Instagram / 图片或视频 / 用户名 / 帖子ID</li>
      <li>X / 图片或视频 / 用户名 / 帖子ID</li>
    </ul>
    <p class="hint">WebP 原文件、PNG 副本和 Live Photo 动态文件均放在对应的图片目录。</p>
    <p class="hint">主下载目录由 Chrome 控制。如需更改磁盘位置，请前往 Chrome 的下载设置。</p>
  </main>
</body>
</html>
